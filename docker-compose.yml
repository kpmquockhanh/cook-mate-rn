# Runs the backend API, the pipeline's operator console, and the voice agent.
# The Expo app itself is not part of this: it's a mobile client (run via
# `npm start` / Expo Go / a device build), not a service to containerize.
#
# Usage:
#   cp .env.example .env                   # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD,
#                                           # POSTGRES_PASSWORD (+ optional POSTGRES_USER,
#                                           # POSTGRES_DB) - compose reads the root .env
#   cp backend/.env.example backend/.env   # fill in DATABASE_URL (the 127.0.0.1 one, for
#                                           # host-side commands), provider keys,
#                                           # S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY
#                                           # (the MinIO credentials), S3_PUBLIC_URL,
#                                           # REVIEW_USERNAME/PASSWORD,
#                                           # CLERK_ISSUER, CLERK_AUTHORIZED_PARTIES,
#                                           # LIVEKIT_URL/_API_KEY/_API_SECRET (voice tokens)
#   cp agent/.env.example agent/.env       # fill in LIVEKIT_*
#   docker compose up -d postgres minio
#   (cd backend && npm run setup)          # once, on a new database: migrate + seed
#   docker compose up --build

services:
  # The database for the pipeline and the API. Nothing migrates on start: run
  # `npm run setup` from backend/ once against a new database (host-side
  # commands reach it on 127.0.0.1:5432).
  #
  # POSTGRES_PASSWORD is pasted into the api/crawler DATABASE_URL below as-is,
  # so keep it to letters and digits - '@', '/', ':', '#' or '%' would break
  # the URL.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cookmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:-cookmate}
    ports:
      - "127.0.0.1:5432:5432" # user data: reachable from this machine only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose: on a fresh volume the image first runs a
      # socket-only init server, which a socket check would call healthy.
      # 127.0.0.1 here is the container's own loopback, not the host's.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Object storage for crawled pages and recipe images (S3 API on 9000, web
  # console on 9001). The backend creates its buckets itself: run
  # `npm run dev -- storage check` and `npm run dev -- images --check`.
  #
  # MinIO no longer publishes images (minio/minio is gone from Docker Hub);
  # pgsty/minio is the Pigsty project's build of the same server. Pinned:
  # bump the tag deliberately.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the root .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the root .env}
    ports:
      - "9000:9000" # S3 API: phones on the LAN load images from it
      # The console logs in with the root credentials, so it stays on this machine.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  api:
    build: ./backend
    command: ["npm", "run", "api"]
    env_file: ./backend/.env
    environment:
      # localhost inside a container is the container itself. S3_PUBLIC_URL
      # is not overridden: it has to be an address the phone can reach.
      S3_ENDPOINT: http://minio:9000
      # Overrides backend/.env's 127.0.0.1 URL, which is for host-side commands.
      DATABASE_URL: postgres://${POSTGRES_USER:-cookmate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cookmate}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8787:8787"
    restart: unless-stopped

  crawler:
    build: ./backend
    command: ["npm", "run", "ui"]
    env_file: ./backend/.env
    environment:
      # The console binds 127.0.0.1 by default, which is the container's own
      # loopback interface - unreachable through the port mapping below even
      # with it published. This opens it up instead, which is only safe
      # because startConsole() refuses to run without REVIEW_USERNAME/
      # REVIEW_PASSWORD (see backend/src/ui/server.ts).
      REVIEW_HOST: "0.0.0.0"
      S3_ENDPOINT: http://minio:9000
      DATABASE_URL: postgres://${POSTGRES_USER:-cookmate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cookmate}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "5174:5174"
    restart: unless-stopped

  agent:
    build: ./agent
    command: ["npm", "run", "start"]
    env_file: ./agent/.env
    # omnivoice-server runs on the host, not in this file: it wants the GPU and
    # a multi-gigabyte model cache, so containerizing it here would be a second,
    # much heavier decision. `127.0.0.1` inside the container is the container,
    # so an OMNIVOICE_URL pointing at a host-run server has to say
    # http://host.docker.internal:8880 - which is what this mapping resolves.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8082"
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
