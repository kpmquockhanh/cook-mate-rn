<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CookMate Review Queue</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --border: #e5e0d8; --text: #1f1d1a;
    --muted: #6f695f; --accent: #c2410c; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17150f; --panel:#201d16; --border:#33302a; --text:#f2ede4; --muted:#a29a8c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;
         background:var(--bg); color:var(--text); }
  header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex;
           gap:16px; align-items:center; flex-wrap:wrap; position:sticky; top:0;
           background:var(--bg); z-index:2; }
  h1 { font-size:16px; margin:0; font-weight:650; }
  .tabs { display:flex; gap:4px; }
  .tab { padding:5px 12px; border:1px solid var(--border); border-radius:99px;
         background:none; color:var(--muted); cursor:pointer; font-size:13px; }
  .tab[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stats { margin-left:auto; color:var(--muted); font-size:12px; }
  main { padding:20px; display:grid; gap:16px; max-width:900px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .card-head { display:flex; gap:14px; padding:14px; align-items:flex-start; }
  .thumb { width:84px; height:84px; border-radius:8px; object-fit:cover;
           background:var(--border); flex-shrink:0; }
  .title { font-weight:600; margin:0 0 4px; font-size:15px; }
  .meta { color:var(--muted); font-size:12px; }
  .meta a { color:var(--muted); }
  .score { margin-left:auto; text-align:right; flex-shrink:0; }
  .score b { font-size:22px; display:block; line-height:1; }
  .issues { display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 12px; }
  .chip { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid; }
  .fatal { color:var(--bad); border-color:var(--bad); }
  .major { color:var(--warn); border-color:var(--warn); }
  .minor { color:var(--muted); border-color:var(--border); }
  .body { display:none; border-top:1px solid var(--border); padding:14px;
          gap:20px; grid-template-columns:1fr 1fr; }
  .card.open .body { display:grid; }
  .body h4 { margin:0 0 8px; font-size:12px; text-transform:uppercase;
             letter-spacing:.06em; color:var(--muted); }
  ol, ul { margin:0; padding-left:18px; }
  li { margin-bottom:7px; }
  .unlinked { color:var(--bad); }
  .timer { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px;
           background:var(--accent); color:#fff; margin-left:6px; }
  .uses { color:var(--muted); font-size:12px; }
  .actions { display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--border); }
  button.act { padding:6px 14px; border-radius:6px; border:1px solid var(--border);
               background:none; color:var(--text); cursor:pointer; font-size:13px; }
  button.approve { border-color:var(--ok); color:var(--ok); }
  button.reject { border-color:var(--bad); color:var(--bad); }
  .empty { text-align:center; color:var(--muted); padding:60px 0; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:6px 10px; border-bottom:1px solid var(--border); font-size:13px; }
  @media (max-width:640px){ .body { grid-template-columns:1fr; } main { padding:16px; } }
</style>
</head>
<body>
<header>
  <h1>CookMate Review Queue</h1>
  <div class="tabs" id="tabs">
    <button class="tab" data-view="review" aria-selected="true">Review</button>
    <button class="tab" data-view="rejected">Rejected</button>
    <button class="tab" data-view="approved">Approved</button>
    <button class="tab" data-view="unmatched">Unmatched ingredients</button>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<script>
const main = document.getElementById('main');
const statsEl = document.getElementById('stats');
let view = 'review';

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const mmss = (s) => s == null ? '' : (s >= 3600
  ? `${Math.floor(s/3600)}h ${Math.round(s%3600/60)}m`
  : `${Math.round(s/60)}m`);

async function loadStats() {
  const rows = await (await fetch('/api/stats')).json();
  statsEl.textContent = rows.map(r => `${r.status}: ${r.count}`).join('  ·  ');
}

async function decide(id, decision, card) {
  await fetch('/api/decide', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id, decision }),
  });
  card.style.opacity = '.35';
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  loadStats();
}

function renderRecipe(row) {
  const card = document.createElement('div');
  card.className = 'card';
  const enriched = row.enriched?.steps ?? [];
  const ing = row.ingredients ?? [];

  const issues = (row.quality_issues ?? [])
    .map(i => `<span class="chip ${i.severity}" title="${esc(i.message)}">${esc(i.code)}</span>`)
    .join('');

  const steps = (row.steps ?? []).map((s) => {
    const e = enriched.find(x => x.index === s.index);
    const uses = (e?.ingredientIndices ?? []).map(i => ing[i]?.name).filter(Boolean);
    return `<li>${esc(s.text)}
      ${e?.durationSeconds ? `<span class="timer">${esc(e.timerName)} · ${mmss(e.durationSeconds)}</span>` : ''}
      ${uses.length ? `<div class="uses">uses: ${esc(uses.join(', '))}</div>` : ''}
    </li>`;
  }).join('');

  const ingredients = ing.map(i => `<li class="${i.canonicalId ? '' : 'unlinked'}">
      ${esc([i.qty, i.unit].filter(Boolean).join(' '))} ${esc(i.name)}
      ${i.canonicalSlug ? `<span class="uses">→ ${esc(i.canonicalSlug)}</span>` : '<span class="uses">(unmatched)</span>'}
    </li>`).join('');

  card.innerHTML = `
    <div class="card-head">
      ${row.image_url ? `<img class="thumb" src="${esc(row.image_url)}" alt="" loading="lazy">` : '<div class="thumb"></div>'}
      <div>
        <p class="title">${esc(row.title ?? 'Untitled')}</p>
        <div class="meta">
          ${row.servings ? row.servings + ' servings · ' : ''}${mmss(row.total_time_seconds)}
          ${row.enrichment_model ? ' · ' + esc(row.enrichment_model) : ''}<br>
          <a href="${esc(row.source_url)}" target="_blank" rel="noopener">${esc(row.source_url)}</a>
        </div>
      </div>
      <div class="score"><b>${row.quality_score ?? '–'}</b><span class="meta">score</span></div>
    </div>
    ${issues ? `<div class="issues">${issues}</div>` : ''}
    <div class="body">
      <div><h4>Ingredients</h4><ul>${ingredients}</ul></div>
      <div><h4>Steps</h4><ol>${steps}</ol></div>
    </div>
    <div class="actions">
      <button class="act toggle">Details</button>
      <button class="act approve">Approve</button>
      <button class="act reject">Reject</button>
    </div>`;

  card.querySelector('.toggle').onclick = () => card.classList.toggle('open');
  card.querySelector('.approve').onclick = () => decide(row.id, 'approved', card);
  card.querySelector('.reject').onclick = () => decide(row.id, 'rejected', card);
  return card;
}

async function render() {
  main.innerHTML = '<div class="empty">Loading…</div>';
  if (view === 'unmatched') {
    const rows = await (await fetch('/api/unmatched')).json();
    main.innerHTML = rows.length === 0
      ? '<div class="empty">Nothing unmatched.</div>'
      : `<table><tr><th>Count</th><th>Normalized</th><th>Example</th></tr>${
        rows.map(r => `<tr><td>${r.occurrences}</td><td>${esc(r.normalized)}</td><td>${esc(r.raw_name)}</td></tr>`).join('')
      }</table>`;
    return;
  }
  const rows = await (await fetch('/api/queue?status=' + view)).json();
  main.innerHTML = '';
  if (rows.length === 0) { main.innerHTML = `<div class="empty">Nothing in “${view}”.</div>`; return; }
  for (const row of rows) main.appendChild(renderRecipe(row));
}

document.getElementById('tabs').onclick = (event) => {
  const tab = event.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t === tab)));
  view = tab.dataset.view;
  render();
};

loadStats();
render();
</script>
</body>
</html>
