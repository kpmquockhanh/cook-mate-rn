# The backend and the voice agent are separate npm packages that are checked
# independently, so they get their own jobs rather than one long script - a
# backend test failure should not hide an agent type error.
#
# Node comes from .nvmrc, which is pinned to the same major the Dockerfiles
# build on. Keep those two in step.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Typecheck
        run: npm run typecheck
        working-directory: backend
      # The suite is deliberately runnable with no Supabase project and no
      # DATABASE_URL: raw-page storage falls back to the filesystem store.
      - name: Test
        run: npm test
        working-directory: backend

  agent:
    name: Voice agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
        working-directory: agent
      - name: Typecheck
        run: npm run typecheck
        working-directory: agent
      - name: Unit tests
        run: npm test
        working-directory: agent
