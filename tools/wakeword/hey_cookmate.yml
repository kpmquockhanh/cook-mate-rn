# Keys not listed here take openWakeWord's defaults from examples/custom_model.yml in the pinned tag; check them against that file before training.

model_name: hey_cookmate
target_phrase:
  - "hey cookmate"
  - "hey cook mate"
# Near-misses the model must learn to reject.
custom_negative_phrases:
  - "hey cook"
  - "cook mate"
  - "hey mate"
  - "hey cookie"
  - "okay cook"
  - "coconut"
  - "cook meat"
  - "hey, look, wait"
n_samples: 50000
n_samples_val: 2000
tts_batch_size: 50
augmentation_batch_size: 16
piper_sample_generator_path: "./work/piper-sample-generator"
output_dir: "./work/out"
rir_paths:
  - "./data/rirs"
# Both are scanned non-recursively, so they are siblings rather than one
# folder with subfolders. Your own kitchen audio is duplicated because
# there is far less of it than AudioSet and it is the closer match to what
# the phone mic actually hears.
background_paths:
  - "./data/background/audioset"
  - "./data/background/kitchen"
background_paths_duplication_rate:
  - 1
  - 2
false_positive_validation_data_path: "./data/validation_set_features.npy"
augmentation_rounds: 1
feature_data_files:
  "ACAV100M_sample": "./data/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50
model_type: dnn
layer_size: 32
steps: 50000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
